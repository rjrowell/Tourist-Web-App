openapi: 3.0.0
info:
  title: "API"
  version: "1.0.0"
paths:
  /v1/authentication:
    get:
      operationId: ping-auth
      summary: Ping authentication controller to see if it is reachable
      responses:
        '200':
          description: Pinged successfully
  '/v1/authentication/authenticate-user':
    post:
      operationId: authenticate-user
      summary: For a given username and password, authenticate them.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
      responses:
        '200':
          description: Authenitcation successfull
        '401':
          description: Unauthorized - Invalid username or password
        '500':
          description: Internal Server Error - Something went wrong on the server side
  '/v1/account/create-user':
    post:
      operationId: create-user
      summary: Create a user account with a given username and password.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
      responses:
        '201':
          description: Created
        '409':
          description: Conflict - Username already exists
  '/v1/content/create-post':
    post:
      operationId: create-post
      summary: Create a post with a given title and content.
      requestBody:
        content:
          application/json:
            schema:
              title: CreatePostRequest
              type: object
              properties:
                userId:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                address:
                  type: string
                datePosted:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Created
  '/v1/content/fetch-posts':
    get:
      operationId: fetch-posts
      summary: Fetch all posts.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: FetchPostsResponse
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      title: PostDTO
                      type: object
                      properties:
                        id:
                          type: integer
                        username:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        address:
                          type: string
                        datePosted:
                          type: string
                          format: date-time
        '404':
          description: Not Found - No posts found
  '/v1/content/delete-post/{postId}':
    delete:
      operationId: delete-post
      summary: Delete a post with a given post ID.
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK - Post deleted successfully
        '404':
          description: Not Found - Post with the given ID does not exist
  '/v1/content/delete-comment/{commentId}':
    delete:
      operationId: delete-comment
      summary: Delete a comment with a given comment ID.
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK - Comment deleted successfully
        '404':
          description: Not Found - Comment with the given ID does not exist
  '/v1/content/add-like':
    post:
      operationId: add-like
      summary: Add a like to a post with a given user ID and post ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LikeRequest'
      responses:
        '200':
          description: OK - Like added successfully
        '404':
          description: Not Found - User or post with the given ID does not exist
  '/v1/content/get-like':
    get:
      operationId: get-like
      summary: Get the like status for a given user ID and post ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LikeRequest'
      responses:
        '200':
          description: OK - Like status retrieved successfully
          content:
            application/json:
              schema:
                title: GetLikeResponse
                type: object
                properties:
                  likeStatus:
                    type: boolean
        '404':
          description: Not Found - User or post with the given ID does not exist
  '/v1/content/fetch-likes/{postId}':
    get:
      operationId: fetch-likes
      summary: Fetch the number of likes for a given post ID.
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK - Number of likes retrieved successfully
          content:
            application/json:
              schema:
                title: FetchLikesResponse
                type: object
                properties:
                  likeCount:
                    type: integer
        '404':
          description: Not Found - Post with the given ID does not exist

components:
  schemas:
    UserCredentials:
      title: UserCredentials
      type: object
      properties:
        hashedPassword: 
          type: string
        username: 
          type: string
        isAdmin:
          type: boolean
      required:
        - username
        - hashedPassword
        - isAdmin
    LikeRequest:
      title: LikeRequest
      type: object
      properties:
        userId:
          type: integer
        postId:
          type: integer
        status:
          type: boolean
      required:
        - userId
        - postId
  responses:
    AuthResponse:
      description: OK
      content:
        application/json:
          schema:
            title: authResponse
            type: object
            properties:
              resp:
                type: integer
              authSuccess:
                type: boolean