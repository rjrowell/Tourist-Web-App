openapi: 3.0.0
info:
  title: "API"
  version: "1.0.0"
paths:
  /v1/authentication:
    get:
      operationId: ping-auth
      summary: Ping authentication controller to see if it is reachable
      responses:
        '200':
          description: Pinged successfully
  '/v1/authentication/authenticate-user':
    post:
      operationId: authenticate-user
      summary: For a given username and password, authenticate them.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
      responses:
        '200':
          description: Authenitcation successfull
        '401':
          description: Unauthorized - Invalid username or password
        '500':
          description: Internal Server Error - Something went wrong on the server side
  '/v1/account/create-user':
    post:
      operationId: create-user
      summary: Create a user account with a given username and password.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCredentials'
      responses:
        '201':
          description: Created
        '409':
          description: Conflict - Username already exists
  '/v1/content/create-post':
    post:
      operationId: create-post
      summary: Create a post with a given title and content.
      requestBody:
        content:
          application/json:
            schema:
              title: CreatePostRequest
              type: object
              properties:
                username:
                  type: string
                title:
                  type: string
                description:
                  type: string
                address:
                  type: string
                datePosted:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Created
  '/v1/content/get-post':
    get:
      operationId: get-post
      summary: Get a post with a given post id.
      requestBody:
        content:
          application/json:
            schema:
              title: GetPostRequest
              type: object
              properties:
                postId:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetPostResponse
                type: object
                properties:
                  title:
                    type: string
                  description:
                    type: string
                  address:
                    type: string
                  datePosted:
                    type: string
                    format: date-time
        '404':
          description: Not Found - No post found with the given post id

components:
  schemas:
    UserCredentials:
      title: UserCredentials
      type: object
      properties:
        hashedPassword: 
          type: string
        username: 
          type: string
      required:
        - username
        - hashedPassword
  responses:
    AuthResponse:
      description: OK
      content:
        application/json:
          schema:
            title: authResponse
            type: object
            properties:
              resp:
                type: integer
              authSuccess:
                type: boolean